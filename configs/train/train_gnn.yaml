# Basic settings
method_type: PS            # PS-style weighted-BCE training + trust-region search at test
task: MVC
difficulty: hard
gurobi_time: "3600s"
solver_settings: gurobi

device: cuda:0
seed: 0

# Data
data_dir: ./dataset
batch_size: 1
num_workers: 0
train_split: 0.7

# Real coefficient edges (see src.utils.utils.build_edge_features).
use_edge_coeff: true
edge_nfeats: 2

# Model: pick a bipartite-tailored encoder.
#   gasse | bipartite_attention | random_feature | tripartite | gcn
gnn_type: gasse
emb_size: 64
constraint_nfeats: 4
variable_nfeats: 6

# Encoder hyper-parameters (only the relevant ones are used per gnn_type)
depth: 4
jumping_knowledge: true
heads: 4               # bipartite_attention
dropout: 0.0          # bipartite_attention
n_rand: 8             # random_feature

# Training
lr: 0.00001
num_epochs: 2000
patience: 100
min_delta: 1.0e-5

# Saving
model_save_dir: ./pretrain_models
log_save_dir: ./train_logs
save_top_k: 3
