# Basic settings
method_type: PS            # PS-style weighted-BCE training + trust-region search at test
task: MVC
difficulty: hard
gurobi_time: "3600s"
solver_settings: gurobi

device: cuda:0
seed: 0

# Data
data_dir: ./dataset
batch_size: 1
num_workers: 0
train_split: 0.7

# Real coefficient edges (see src.utils.utils.build_edge_features).
use_edge_coeff: true
edge_nfeats: 2

# Model: pick a bipartite GNN encoder.
#   gcn | gasse | bipartite_attention | random_feature | tripartite
#   | graph_transformer | bipartite_gin | rwse | substructure
#   | graphgps | lap_pe | id_gnn | edge_gnn
#   bipartite_gin  -- bipartite GINE (injective sum aggregation)
#   rwse           -- random-walk structural encoding
#   substructure   -- bipartite closed-walk / butterfly-count features
#   graphgps       -- local half-conv + global attention + random-walk encoding
#   lap_pe         -- Laplacian spectral positional encoding
#   id_gnn         -- identity-aware GNN (per-root tagging; O(roots) cost)
#   edge_gnn       -- edge-updating GNN (per-edge state for a_ij)
gnn_type: gasse
emb_size: 64
constraint_nfeats: 4
variable_nfeats: 6

# Encoder hyper-parameters (only the relevant ones are used per gnn_type)
depth: 4
jumping_knowledge: true
heads: 4               # bipartite_attention / graph_transformer / graphgps
dropout: 0.0          # bipartite_attention / graph_transformer / graphgps
n_rand: 8             # random_feature
walk_length: 8        # rwse / graphgps: number of random-walk steps in the structural encoding
struct_powers: [4, 6] # substructure: adjacency powers for the closed-walk counts
train_eps: true       # bipartite_gin: learnable (1+eps) GINE self-term
pe_dim: 8             # lap_pe: number of Laplacian eigenvectors/eigenvalues
max_roots: 32         # id_gnn: max #roots given the identity treatment (>= n_var for full power)

# Training
lr: 0.00001
num_epochs: 2000
patience: 100
min_delta: 1.0e-5

# Saving
model_save_dir: ./pretrain_models
log_save_dir: ./train_logs
save_top_k: 3
