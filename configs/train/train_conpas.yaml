# Basic settings
method_type: ConPaS        # contrastive PS training; trust-region search at test
task: MVC
difficulty: hard
gurobi_time: "3600s"
solver_settings: gurobi

device: cuda:0
seed: 0

# Data
data_dir: ./dataset
batch_size: 1
num_workers: 0
train_split: 0.7

# Real coefficient edges
use_edge_coeff: true
edge_nfeats: 2

# Model: any PS-family encoder (gcn / gasse / bipartite_attention / random_feature / tripartite)
gnn_type: gcn
emb_size: 64
constraint_nfeats: 4
variable_nfeats: 6
depth: 4
jumping_knowledge: true
heads: 4
dropout: 0.0
n_rand: 8

# ConPaS loss
tau: 0.1        # InfoNCE temperature
pos_frac: 0.2   # top fraction of the (weight-ranked) pool used as positives
neg_frac: 0.5   # bottom fraction used as negatives

# Training
lr: 0.00001
num_epochs: 2000
patience: 100
min_delta: 1.0e-5

# Saving
model_save_dir: ./pretrain_models
log_save_dir: ./train_logs
save_top_k: 3
