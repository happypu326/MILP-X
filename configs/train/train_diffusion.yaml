# Basic settings
method_type: Diffusion     # discrete Bernoulli diffusion predictor + trust-region search
task: MVC
difficulty: hard
gurobi_time: "3600s"
solver_settings: gurobi

device: cuda:0
seed: 0

# Data
data_dir: ./dataset
batch_size: 1
num_workers: 0
train_split: 0.7

# Real coefficient edges
use_edge_coeff: true
edge_nfeats: 2

# Denoiser (bipartite half-conv GNN)
emb_size: 64
constraint_nfeats: 4
variable_nfeats: 6
depth: 4
jumping_knowledge: true

# Diffusion process
num_timesteps: 200
schedule: cosine        # cosine | linear

# Training
lr: 0.0001
num_epochs: 2000
patience: 100
min_delta: 1.0e-5

# Saving
model_save_dir: ./pretrain_models
log_save_dir: ./train_logs
save_top_k: 3
