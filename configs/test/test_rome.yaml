# Basic settings
method_type: RoME
test_problem_type: CA
training_problem_types: IS_IP_SC
difficulty: easy

device: cuda:0
seed: 0

instance_dir: ./data/test

# Model configuration
gnn_type: moe
emb_size: 64
constraint_nfeats: 4
edge_nfeats: 1
variable_nfeats: 6
num_shared_experts: 1
num_dedicate_experts: 3
top_k: 1
gate_temperature: 1.0
bias_lr: 1.0e-3
use_dro: true
eps_wasserstein: 0.1
dro_perturb_type: gaussian

# Testing configuration
fix_strategy: pas
hyperparam_pas:
  IP: [60, 30, 70]
  MIS: [600, 600, 100]
  WA: [20, 200, 100]
  CA: [150, 0, 25]
  SC: [300, 0, 100]
  BP: [100, 0, 50]
  CFLP: [30, 0, 30]
  GISP: [1000, 100, 120]
  LB: [300, 100, 150]
  MVC: [40, 0, 30]
  MIRP: [120, 30, 100]
  MMCN: [200, 0, 150]
  NNV: [10, 25, 6]
  OTS: [300, 0, 200]
  SRPN: [150, 150, 200]
  IS: [600, 600, 100]
hyperparam_soft:
  CA: [0.99, 0.12]
  IP: [0.93, 0.01]
  SC: [0.96, 0.02]
  MIS: [0.95, 0.05]
  CFLP: [0.98, 0.02]
  GISP: [0.95, 0.05]
  LB: [0.99, 0.15]
  MVC: [0.97, 0.02]
  BP: [0.95, 0.05]
  MIRP: [0.99, 0.20]
  MMCN: [0.97, 0.15]
  NNV: [0.97, 0.30]
  OTS: [0.97, 0.15]
  SRPN: [0.97, 0.15]
  IIS: [0.97, 0.02]
  IS: [0.95, 0.05]

# Solver configuration
solver: gurobi
time_limits: 1000
threads: 1
num_workers: 20

# Paths
time_flag: "20260404_082942"
model_path: ./pretrain_models/${method_type}/${training_problem_types}/${time_flag}_${gnn_type}_shared_${num_shared_experts}_dedicate_${num_dedicate_experts}_model_best.pth
log_dir: ./test_logs/${method_type}/${solver}/${test_problem_type}/${difficulty}/${time_limits}s/${time_flag}/
result_dir: ./test_results/${method_type}/${solver}/${test_problem_type}/${difficulty}/${time_limits}s/${time_flag}/
scores_dir: ./scores/${method_type}/${solver}/${test_problem_type}/${difficulty}/${time_limits}s/${time_flag}/
save_scores: True

