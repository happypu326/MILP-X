# Basic settings
method_type: LNS
test_problem_type: MIS
difficulty: easy
device: cuda:0
seed: 0
instance_dir: ./data/test

# Predictor (used only when lns_mode=prediction); any PS-family encoder
gnn_type: gcn
emb_size: 64
constraint_nfeats: 4
use_edge_coeff: true
edge_nfeats: 2
variable_nfeats: 6

# LNS harness
lns_mode: prediction     # prediction | random
n_iters: 5
destroy_frac: 0.3        # fraction of binaries unfixed (destroyed) per iteration
init_time: 30            # seconds for the initial incumbent solve
iter_time: 20            # seconds per repair sub-MIP
maximize: false          # set true for MIS/CA/IS-style maximization

# Solver
solver: gurobi
threads: 1
num_workers: 20

# Paths (model_path only needed for lns_mode=prediction)
time_flag: "20260404_000000"
model_path: ./pretrain_models/PS/${test_problem_type}/${time_flag}_gcn_model_best.pth
log_dir: ./test_logs/${method_type}/${lns_mode}/${test_problem_type}/${difficulty}/${time_flag}/
result_dir: ./test_results/${method_type}/${lns_mode}/${test_problem_type}/${difficulty}/${time_flag}/
