# Basic settings
method_type: Diffusion
test_problem_type: MIS
difficulty: easy

device: cuda:0
seed: 0

instance_dir: ./data/test

# Model / denoiser
gnn_type: diffusion
emb_size: 64
constraint_nfeats: 4
use_edge_coeff: true
edge_nfeats: 2
variable_nfeats: 6
depth: 4
jumping_knowledge: true

# Diffusion sampling
num_timesteps: 200
inference_steps: 50
n_samples: 4
schedule: cosine

# CGD (2608.13079): training-free feasibility projection during reverse sampling
feasibility_projection: false
proj_steps: 5
proj_lr: 0.1

# Trust-region search (same knobs as PS)
fix_strategy: pas
hyperparam_pas:
  MIS: [600, 600, 100]
  CA: [150, 0, 25]
  SC: [300, 0, 100]
  MVC: [40, 0, 30]
  IS: [600, 600, 100]
hyperparam_soft:
  MIS: [0.95, 0.05]
  CA: [0.99, 0.12]
  SC: [0.96, 0.02]
  MVC: [0.97, 0.02]
  IS: [0.95, 0.05]

# Solver
solver: gurobi
time_limits: 1000
threads: 1
num_workers: 20

# Paths
time_flag: "20260404_000000"
model_path: ./pretrain_models/${method_type}/${test_problem_type}/${time_flag}_diffusion_model_best.pth
log_dir: ./test_logs/${method_type}/${solver}/${test_problem_type}/${difficulty}/${time_limits}s/${time_flag}/
result_dir: ./test_results/${method_type}/${solver}/${test_problem_type}/${difficulty}/${time_limits}s/${time_flag}/
scores_dir: ./scores/${method_type}/${solver}/${test_problem_type}/${difficulty}/${time_limits}s/${time_flag}/
save_scores: True
